name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-config:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch the Claude Code settings schema
        run: curl -fsSL https://json.schemastore.org/claude-code-settings.json -o /tmp/schema.json

      - name: Validate claude-settings.json values
        run: pipx run check-jsonschema --schemafile /tmp/schema.json claude-settings.json

      # The schema sets additionalProperties: true, so the value check above
      # accepts keys Claude Code does not implement. Compare key sets as well.
      - name: Reject unknown claude-settings.json keys
        run: |
          jq -r '.properties | keys[]' /tmp/schema.json | sort > /tmp/known.txt
          jq -r 'keys[] | select(. != "$schema")' claude-settings.json | sort > /tmp/used.txt
          unknown=$(comm -23 /tmp/used.txt /tmp/known.txt)
          if [ -n "$unknown" ]; then
            echo "Unknown claude-settings.json keys:" >&2
            echo "$unknown" >&2
            exit 1
          fi
          echo "All $(wc -l < /tmp/used.txt) keys are known to the schema."

      # The image build validates this file properly via `codex --strict-config`;
      # this is the cheap syntax gate for pushes that skip the build job.
      - name: Check codex-config.toml parses
        run: python3 -c 'import tomllib; tomllib.load(open("codex-config.toml","rb"))'

      - name: Check herdr-config.toml parses
        run: python3 -c 'import tomllib; tomllib.load(open("herdr-config.toml","rb"))'

      - name: Check Playwright pin and container flags
        run: python3 scripts/check_playwright_pin.py

  build:
    # The image build runs the Dockerfile smoke test, so a green build is the
    # gate Renovate automerge waits on. Single-arch keeps it under the timeout;
    # manual runs and the release workflow build both architectures natively.
    if: github.event_name != 'push'
    # Keep the amd64 check name required by the main ruleset.
    name: ${{ matrix.arch == 'amd64' && 'build' || 'build-arm64' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["amd64", "arm64"]') || fromJSON('["amd64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build (linux/${{ matrix.arch }}, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}
