name: Renovate

on:
  workflow_dispatch:
  schedule:
    # Three hours ahead of the image build, so automerged updates are on main
    # by the time it starts.
    - cron: "0 18 * * 0" # Every Monday 03:00 KST (18:00 UTC Sunday)

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@3064367f740a1a91cca218698a63902689cce200 # v46.1.20
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
