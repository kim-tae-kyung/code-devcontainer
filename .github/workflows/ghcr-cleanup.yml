name: GHCR Cleanup

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List versions to delete without deleting"
        type: boolean
        default: true

# Shared with the build workflow so cleanup never runs against a package that is
# mid-push.
concurrency:
  group: ghcr-package
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Cleanup GHCR - keep only :latest
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ github.event.repository.name }}
          exclude-tags: latest
          keep-n-tagged: 0
          delete-untagged: true
          dry-run: ${{ inputs.dry-run }}
