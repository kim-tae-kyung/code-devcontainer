# Full autonomy for trusted IaaS development, including cluster administration.
# https://developers.openai.com/codex/agent-approvals-security
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"

# Long-task tuning, not OpenAI-recommended optimal context sizes.
# https://learn.chatgpt.com/docs/config-file/config-reference
model = "gpt-6-astra"
model_context_window = 512000
model_auto_compact_token_limit = 430000

# Planning is high-leverage work; always use the maximum configured effort.
# Extra High suits difficult work with multiple steps, sources, or tradeoffs.
# https://learn.chatgpt.com/docs/config-file/config-reference
# https://learn.chatgpt.com/docs/models
plan_mode_reasoning_effort = "xhigh"

[features]
memories = false
# Herdr's Codex integration reports native session identity through hooks.
hooks = true

# Opt in for new tasks; activation also requires an eligible ChatGPT account
# and a model catalog advertising experimental context support.
# https://learn.chatgpt.com/docs/models#experimental-context-management
[features.context_management]
experimental_mode = true

# Disable cross-task memory generation/injection and history.jsonl recording.
# These are separate from experimental same-task context notes/history.
# https://developers.openai.com/codex/config-reference
[memories]
use_memories = false

[history]
persistence = "none"

# Explicit telemetry opt-out (unset falls back to the client default).
[analytics]
enabled = false

# `kubectl exec` does not reliably expose the outer terminal identity, so force
# Ghostty-compatible OSC 9 instead of relying on auto detection; notify
# regardless of terminal focus. Render on the main screen for scrollback.
# https://learn.chatgpt.com/docs/config-file/config-advanced#notifications
# https://github.com/openai/codex/pull/8555
[tui]
notifications = true
notification_method = "osc9"
notification_condition = "always"
alternate_screen = "never"

# context7 tracks `@latest`. Playwright is pinned to the version the image built
# Chromium for; keep it equal to PLAYWRIGHT_MCP_VERSION in the Dockerfile.
# startup_timeout_sec: headroom for cold `npx -y` installs in a fresh pod.
# https://github.com/openai/codex/issues/11851
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 60

# tool_timeout_sec: browser navigation/screenshots routinely exceed the 60s default.
[mcp_servers.playwright]
command = "npx"
args = [
  "-y",
  "@playwright/mcp@0.0.80",
  "--headless",
  "--browser=chromium",
  "--no-sandbox",
]
startup_timeout_sec = 60
tool_timeout_sec = 120
