# Full autonomy for trusted IaaS development, including cluster administration.
# https://developers.openai.com/codex/agent-approvals-security
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"

# Default model and effort for ordinary work. GPT-6.1 Sol is OpenAI's
# recommended model for complex coding and agentic workflows.
# https://learn.chatgpt.com/docs/models
# https://learn.chatgpt.com/docs/config-file/config-reference
model = "gpt-6.1-sol"
model_reasoning_effort = "high"

# Planning is high-leverage work; Extra High suits difficult work with
# multiple steps, sources, or tradeoffs. Max and Ultra are left for /model.
# https://learn.chatgpt.com/docs/config-file/config-reference
# https://learn.chatgpt.com/docs/models
plan_mode_reasoning_effort = "xhigh"

[features]
memories = false
# Herdr's Codex integration reports native session identity through hooks.
hooks = true

# Disable cross-task memory generation/injection and history.jsonl recording.
# https://developers.openai.com/codex/config-reference
[memories]
use_memories = false

[history]
persistence = "none"

# Explicit telemetry opt-out (unset falls back to the client default).
[analytics]
enabled = false

# Inside a Herdr pane (TERM_PROGRAM=herdr) only BEL reaches the outer terminal;
# Herdr's own toast carries the desktop notification. Main-screen output stays
# in Herdr's host scrollback for `herdr agent read` and handoff.
# Codex clears and rebuilds that scrollback whenever the pane is resized, as
# when a different-sized client reattaches, and replays it on resume. For
# terminals it cannot identify, Herdr included, it keeps only the newest 1,000
# rendered rows; 0 keeps them all and leaves retention to Herdr's limit.
# https://learn.chatgpt.com/docs/config-file/config-reference
# https://herdr.dev/docs/agent-automation/
# https://github.com/openai/codex/blob/main/codex-rs/core/config.schema.json
# https://github.com/openai/codex/blob/main/codex-rs/tui/src/resize_reflow_cap.rs
[tui]
notifications = true
notification_method = "bel"
notification_condition = "always"
alternate_screen = "never"
terminal_resize_reflow_max_rows = 0

# Playwright is pinned to the version the image built Chromium for; keep it
# equal to PLAYWRIGHT_MCP_VERSION in the Dockerfile.
# startup_timeout_sec: headroom for cold `npx -y` installs in a fresh pod.
# https://github.com/openai/codex/issues/11851
# tool_timeout_sec: browser navigation/screenshots routinely exceed the 60s default.
[mcp_servers.playwright]
command = "npx"
args = [
  "-y",
  "@playwright/mcp@0.0.83",
  "--headless",
  "--browser=chromium",
  "--no-sandbox",
]
startup_timeout_sec = 60
tool_timeout_sec = 120
