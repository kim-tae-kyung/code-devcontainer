set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB:extkeys'
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on

# Preserve modified keys and pass agent notification/progress sequences through.
set -g allow-passthrough on
set -s extended-keys on
set -s extended-keys-format csi-u

# Forward copy-mode and application clipboard writes without creating tmux buffers.
set -s set-clipboard external

# Agent CLIs render on the main screen (no alt-screen), so their output lands
# in tmux history; the 2000-line default loses long sessions.
set -g history-limit 100000
